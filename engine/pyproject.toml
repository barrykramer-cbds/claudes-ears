[project]
name = "claudes-ears"
version = "0.1.0"
description = "An audio perception pipeline that listens to music rather than merely measuring it."
requires-python = ">=3.12,<3.13"

# Core application/contract layer — always installed. Light enough that `uv run`
# (which auto-syncs) stays fast for contract, API, and DB work.
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "duckdb>=0.10",
    "httpx>=0.27",
    "numpy>=2.1,<2.5",  # ceiling: numba (via librosa) rejects numpy>=2.5 at import
    "scipy>=1.14",
]

[project.optional-dependencies]
# The heavy ML / DSP runtime. Multi-GB (torch+CUDA via audio-separator, model weights).
# Only required once the real analyze() bodies land (Windows 1-2) and for the
# packaged sidecar — not for type-checking the contract. Install with:
#   uv sync --extra ml
ml = [
    "librosa>=0.11",
    "soundfile>=0.13",
    "scikit-learn>=1.6",
    "numba>=0.61",  # the numpy ceiling source (numba<2.5); older numba is py<3.10-only
    # Separation runner: runs htdemucs_ft (and RoFormer) via librosa/soundfile + onnxruntime;
    # pulls torch>=2.3 with no torchaudio, so it sidesteps demucs's torch<2.9 ceiling.
    "audio-separator[gpu]>=0.44",
    "faster-whisper>=1.2",
    "ctranslate2>=4.4,<5",  # faster-whisper requires <5
    "vaderSentiment>=3.3.2",
    "yt-dlp>=2026.6.0",
    "ffmpeg-python>=0.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
claudes-ears = "claudes_ears.cli:main"
claudes-ears-serve = "claudes_ears.api.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudes_ears"]

# ---------------------------------------------------------------------------
# ruff — lint + format, zero-warning. (Reconciles the former root ruff.toml.)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
# Note: ruff's exclude globs match by basename and `*` spans path separators, so
# there is no "root-only" exclude that would spare src/ during the fan-out. The
# canonical verify therefore scopes ruff to `src tests` (legacy root scripts are
# pre-refactor and migrate into src/ one-per-agent). mypy is scoped via `files`
# below plus a path-anchored exclude, so `mypy` checks the package cleanly.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D200", # one-line docstring stays on one line
    "D201", # no blank line before function docstring
    "D202", # no blank line after function docstring
    "D210", # no surrounding whitespace in docstring
    "D212", # multi-line docstring summary starts on the first line
    "DTZ", # flake8-datetimez
    "EM",  # flake8-errmsg
    "G",   # flake8-logging-format
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "RSE", # flake8-raise
    "RUF", # ruff-specific
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "T20", # flake8-print (no stray print statements)
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops (exception anti-patterns)
]
ignore = [
    "S101",   # use of assert (fine in non-test code here)
    "TRY003", # long messages in raise — acceptable for this codebase
    "EM101",  # string literals in exceptions — acceptable
    "EM102",  # f-string in exceptions — acceptable
    "D203",   # conflicts with D211 (no blank line before class docstring)
    "D213",   # conflicts with D212 (summary on the first line)
    # D204 deliberately not selected: no blank line after a class docstring —
    # tighter, consistent with D211, and avoids noise across ~70 Pydantic models.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["ANN", "S", "T20"]
"**/conftest.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["claudes_ears"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime (even with `from __future__ import
# annotations`), so types used only in model fields must stay importable at
# runtime — don't let TCH move them into a TYPE_CHECKING block.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["claudes_ears", "tests"]
# Same rationale as ruff's extend-exclude: skip the un-migrated legacy root
# scripts (top-level *.py, no path separator) until the fan-out moves them.
exclude = ['^[^/]+\.py$']
# The ml-module overrides below are forward-declared for Windows 1-2 (no module
# imports torch/librosa/etc. yet), so strict's unused-config check would flag
# them as noise. Keep the pre-declaration; silence that specific note.
warn_unused_configs = false

# The ML/DSP tree ships no type stubs. Suppress missing-import noise for those
# packages only; the contract/app layer stays strictly typed.
[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "soundfile.*",
    "audio_separator.*",
    "sklearn.*",
    "torch.*",
    "whisper.*",
    "vaderSentiment.*",
    "yt_dlp.*",
    "ffmpeg.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error"]
